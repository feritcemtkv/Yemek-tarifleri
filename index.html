<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kolay Instagram Tariflerim</title>
<style>
  :root{
    --bg:#f8fafc;
    --card-bg:#ffffff;
    --primary:#4f46e5;
    --primary-soft:#eef2ff;
    --text:#1e293b;
    --text-soft:#64748b;
    --line:#e2e8f0;
    --radius:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  
  header{
    background:#fff; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
  }
  header h1{font-size:18px; font-weight:700; margin:0; color:var(--primary);}
  
  main{padding:16px; max-width:600px; margin:0 auto 80px;}

  .add-box{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:20px; box-shadow:0 4px 12px rgba(0,0,0,.03);
  }
  .add-box h3{margin:0 0 10px; font-size:15px; color:var(--text);}
  .input-group{display:flex; gap:8px;}
  .input-group input{
    flex:1; padding:10px 14px; border:1px solid var(--line);
    border-radius:10px; font-size:14px; outline:none;
  }
  .input-group input:focus{border-color:var(--primary);}
  .input-group button{
    background:var(--primary); color:#fff; border:none;
    padding:0 18px; border-radius:10px; font-weight:600; cursor:pointer; font-size:14px;
  }
  .input-group button:active{transform:scale(0.96);}

  .recipe-card{
    background:var(--card-bg); border:1px solid var(--line);
    border-radius:var(--radius); margin-bottom:16px; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .recipe-header{padding:14px 16px 10px; display:flex; justify-content:space-between; align-items:flex-start;}
  .recipe-title{font-size:16px; font-weight:700; margin:0 0 4px;}
  .recipe-cat{font-size:11px; background:var(--primary-soft); color:var(--primary); padding:2px 8px; border-radius:999px; font-weight:700; text-transform:uppercase;}
  
  .content-grid{display:grid; grid-template-columns:1fr 140px; gap:12px; padding:0 16px 14px;}
  @media(max-width:480px){.content-grid{grid-template-columns:1fr;}}
  
  .details-box{font-size:13.5px; line-height:1.4;}
  .details-box b{font-size:11px; text-transform:uppercase; color:var(--text-soft); display:block; margin-bottom:4px;}
  .details-box ul{margin:0 0 10px; padding-left:16px;}
  
  .video-box{position:relative; width:100%; border-radius:10px; overflow:hidden; background:#000; min-height:180px;}
  .video-box iframe{width:100%; height:100%; border:none; position:absolute; top:0; left:0;}

  .empty{text-align:center; padding:40px; color:var(--text-soft);}
  .delete-btn{background:none; border:none; color:#ef4444; font-size:12px; cursor:pointer; padding:0; margin-top:8px;}
</style>
</head>
<body>

<header>
  <h1>🍳 Pratik Tarif Arşivim</h1>
  <span id="count" style="font-size:13px; color:var(--text-soft);">0 tarif</span>
</header>

<main>
  <div class="add-box">
    <h3>Instagram'dan Yeni Tarif Ekle</h3>
    <div class="input-group">
      <input type="text" id="instaLink" placeholder="Instagram gönderi linkini yapıştır (örn: instagram.com/p/...)">
      <button id="addBtn">Ekle</button>
    </div>
  </div>

  <div id="recipeList"></div>
</main>

<script>
// Tarifler tarayıcının kendi hafızasında saklanır (hiç silinmez)
let recipes = JSON.parse(localStorage.getItem('my_recipes') || '[]');

const $list = document.getElementById('recipeList');
const $count = document.getElementById('count');
const $input = document.getElementById('instaLink');
const $addBtn = document.getElementById('addBtn');

function save(){
  localStorage.setItem('my_recipes', JSON.stringify(recipes));
  render();
}

function render(){
  $count.textContent = recipes.length + ' tarif';

  if(!recipes.length){
    $list.innerHTML = '<div class="empty">Henüz hiç tarif eklemedin.<br>Yukarıdaki kutuya Instagram linki yapıştırarak başlayabilirsin!</div>';
    return;
  }

  $list.innerHTML = recipes.map((r, index) => `
    <div class="recipe-card">
      <div class="recipe-header">
        <div>
          <span class="recipe-cat">${r.category}</span>
          <h2 class="recipe-title">${r.title}</h2>
        </div>
        <button class="delete-btn" onclick="removeRecipe(${index})">Sil</button>
      </div>
      <div class="content-grid">
        <div class="details-box">
          <b>Malzemeler:</b>
          <ul>
            ${r.ingredients.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>
        <div class="video-box">
          <iframe src="${r.embedUrl}" scrolling="no" allowtransparency="true"></iframe>
        </div>
      </div>
    </div>
  `).join('');
}

window.removeRecipe = function(index){
  if(confirm('Bu tarifi silmek istediğine emin misin?')){
    recipes.splice(index, 1);
    save();
  }
};

$addBtn.onclick = () => {
  let val = $input.value.trim();
  if(!val) return alert('Lütfen geçerli bir Instagram linki girin!');

  // Linki embed formatına çevir
  let embedUrl = val;
  if(!embedUrl.includes('/embed')) {
    if(embedUrl.endsWith('/')) embedUrl = embedUrl.slice(0, -1);
    embedUrl = embedUrl + '/embed';
  }

  // Örnek otomatik içerik türetici (İstediğin gibi sonradan değiştirebilirsin)
  const newRecipe = {
    title: "Instagram Tarifim #" + (recipes.length + 1),
    category: "Tatlı & Yemek",
    ingredients: ["Tarif malzemeleri videodadır.", "Ölçüler gram / bardak uyarlıdır."],
    embedUrl: embedUrl
  };

  recipes.unshift(newRecipe);
  $input.value = '';
  save();
};

render();
</script>
</body>
</html>
