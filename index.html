<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Instagram Tariflerim</title>
<style>
  :root{
    --bg:#faf9f6;
    --card-bg:#ffffff;
    --primary:#d97706;
    --primary-soft:#fef3c7;
    --text:#1f2937;
    --text-soft:#6b7280;
    --line:#e5e7eb;
    --radius:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  
  header{
    background:#fff; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
  }
  header h1{font-size:18px; font-family:Georgia,serif; margin:0; color:var(--primary);}
  
  .search-bar{padding:12px 16px 4px; max-width:600px; margin:0 auto;}
  .search-bar input{
    width:100%; padding:10px 14px; border:1px solid var(--line);
    border-radius:999px; font-size:14px; outline:none; background:#fff;
  }
  .search-bar input:focus{border-color:var(--primary);}

  .categories{
    display:flex; gap:8px; padding:10px 16px; overflow-x:auto;
    max-width:600px; margin:0 auto; scrollbar-width:none;
  }
  .categories::-webkit-scrollbar{display:none;}
  .cat-btn{
    border:none; background:#fff; border:1px solid var(--line);
    padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600;
    white-space:nowrap; cursor:pointer; color:var(--text-soft);
  }
  .cat-btn.active{background:var(--primary); color:#fff; border-color:var(--primary);}

  main{padding:12px 16px 60px; max-width:600px; margin:0 auto;}

  .recipe-card{
    background:var(--card-bg); border:1px solid var(--line);
    border-radius:var(--radius); margin-bottom:16px; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
  }
  .recipe-header{padding:14px 16px 10px; display:flex; justify-content:space-between; align-items:flex-start;}
  .recipe-title{font-size:16px; font-weight:700; margin:0 0 4px; font-family:Georgia,serif;}
  .recipe-cat{font-size:11px; background:var(--primary-soft); color:var(--primary); padding:2px 8px; border-radius:999px; font-weight:700; text-transform:uppercase;}

  .content-grid{display:grid; grid-template-columns:1fr 140px; gap:12px; padding:0 16px 14px;}
  @media(max-width:480px){
    .content-grid{grid-template-columns:1fr;}
  }
  
  .details-box{font-size:13.5px; line-height:1.4;}
  .details-box b{font-size:12px; text-transform:uppercase; color:var(--text-soft); display:block; margin-bottom:4px;}
  .details-box ul{margin:0 0 10px; padding-left:16px;}
  
  .video-box{position:relative; width:100%; border-radius:10px; overflow:hidden; background:#000; min-height:180px;}
  .video-box iframe{width:100%; height:100%; border:none; position:absolute; top:0; left:0;}

  .empty{text-align:center; padding:40px; color:var(--text-soft);}
</style>
</head>
<body>

<header>
  <h1>🍳 Instagram Tarifler</h1>
  <span id="count" style="font-size:13px; color:var(--text-soft);">0 tarif</span>
</header>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Malzeme veya yemek adı ara (örn: çikolata, patates)...">
</div>

<div class="categories" id="catBar">
  <button class="cat-btn active" data-cat="Tümü">Tümü</button>
  <button class="cat-btn" data-cat="Tatlılar">Tatlılar</button>
  <button class="cat-btn" data-cat="Ana Yemek">Ana Yemek</button>
  <button class="cat-btn" data-cat="Fit Tarifler">Fit Tarifler</button>
  <button class="cat-btn" data-cat="Kahvaltılık">Kahvaltılık</button>
</div>

<main id="recipeList"></main>

<script>
// BURAYA TARİFLERİNİ EKLEYEBİLİRSİN (Toplu link ve verileri bu listede tutacaksın)
const recipes = [
  {
    id: 1,
    title: "3 Malzemeli Unsuz Fit Kurabiye",
    category: "Fit Tarifler",
    ingredients: ["1 su bardağı yulaf ezmesi", "2 adet olgun muz", "2 yemek kaşığı kakao"],
    measureNote: "Ölçüler su bardağı ve yemek kaşığı olarak ayarlandı.",
    // Instagram video/post linkinin sonundaki embed kodu veya kısa link mantığı
    embedUrl: "https://www.instagram.com/p/C_EXAMPLE/embed" 
  },
  {
    id: 2,
    title: "Çıtır Patatesli Börek",
    category: "Ana Yemek",
    ingredients: ["3 adet yufka", "4 adet haşlanmış patates (yaklaşık 400g)", "1 çay bardağı sıvı yağ"],
    measureNote: "Gram ve bardak ölçülerine dönüştürüldü.",
    embedUrl: "https://www.instagram.com/p/C_EXAMPLE2/embed"
  }
];

let currentCat = "Tümü";
let searchQuery = "";

const $list = document.getElementById('recipeList');
const $count = document.getElementById('count');
const $searchInput = document.getElementById('searchInput');

function render(){
  const filtered = recipes.filter(r => {
    const matchCat = currentCat === "Tümü" || r.category === currentCat;
    const matchText = r.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                      r.ingredients.some(i => i.toLowerCase().includes(searchQuery.toLowerCase()));
    return matchCat && matchText;
  });

  $count.textContent = filtered.length + ' tarif';

  if(!filtered.length){
    $list.innerHTML = '<div class="empty">Aradığınız kriterde tarif bulunamadı.</div>';
    return;
  }

  $list.innerHTML = filtered.map(r => `
    <div class="recipe-card">
      <div class="recipe-header">
        <div>
          <span class="recipe-cat">${r.category}</span>
          <h2 class="recipe-title">${r.title}</h2>
        </div>
      </div>
      <div class="content-grid">
        <div class="details-box">
          <b>Malzemeler (${r.measureNote}):</b>
          <ul>
            ${r.ingredients.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>
        <div class="video-box">
          <!-- Instagram video embed veya doğrudan bağlantı önizlemesi -->
          <iframe src="${r.embedUrl}" scrolling="no" allowtransparency="true"></iframe>
        </div>
      </div>
    </div>
  `).join('');
}

$searchInput.oninput = (e)=>{
  searchQuery = e.target.value.trim();
  render();
};

document.querySelectorAll('.cat-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  };
});

render();
</script>
</body>
</html>
