<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Instagram Tarif Arşivim</title>
<style>
  :root{
    --bg:#f8fafc;
    --card-bg:#ffffff;
    --primary:#e11d48;
    --primary-soft:#ffe4e6;
    --text:#1e293b;
    --text-soft:#64748b;
    --line:#e2e8f0;
    --radius:16px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  
  header{
    background:#fff; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:10;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
  }
  header h1{font-size:18px; font-weight:700; margin:0; color:var(--primary);}
  
  main{padding:16px; max-width:6,00px; margin:0 auto 80px;}

  .add-box{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:20px; box-shadow:0 4px 12px rgba(0,0,0,.03);
  }
  .add-box h3{margin:0 0 10px; font-size:15px; color:var(--text);}
  .input-group{display:flex; gap:8px;}
  .input-group input{
    flex:1; padding:10px 14px; border:1px solid var(--line);
    border-radius:10px; font-size:14px; outline:none;
  }
  .input-group input:focus{border-color:var(--primary);}
  .input-group button{
    background:var(--primary); color:#fff; border:none;
    padding:0 18px; border-radius:10px; font-weight:600; cursor:pointer; font-size:14px;
  }

  .recipe-card{
    background:var(--card-bg); border:1px solid var(--line);
    border-radius:var(--radius); margin-bottom:16px; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.04); padding:16px;
  }
  .recipe-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .recipe-title{font-size:16px; font-weight:700; margin:0 0 4px;}
  .recipe-cat{font-size:11px; background:var(--primary-soft); color:var(--primary); padding:2px 8px; border-radius:999px; font-weight:700; text-transform:uppercase;}
  
  .details-box{font-size:13.5px; line-height:1.4; margin-bottom:12px;}
  .details-box b{font-size:11px; text-transform:uppercase; color:var(--text-soft); display:block; margin-bottom:4px;}
  .details-box ul{margin:0; padding-left:16px;}
  
  .card-footer{display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:12px; margin-top:12px;}
  .watch-btn{
    background:#0f172a; color:#fff; text-decoration:none; padding:8px 14px;
    border-radius:8px; font-size:13px; font-weight:600; display:inline-block;
  }
  .delete-btn{background:none; border:none; color:#ef4444; font-size:13px; cursor:pointer; font-weight:600;}

  .empty{text-align:center; padding:40px; color:var(--text-soft);}
</style>
</head>
<body>

<header>
  <h1>📸 Instagram Tarif Arşivim</h1>
  <span id="count" style="font-size:13px; color:var(--text-soft);">0 tarif</span>
</header>

<main>
  <div class="add-box">
    <h3>Yeni Tarif Ekle</h3>
    <div class="input-group">
      <input type="text" id="instaLink" placeholder="Instagram linkini yapıştır (örn: https://www.instagram.com/p/...)">
      <button id="addBtn">Ekle</button>
    </div>
  </div>

  <div id="recipeList"></div>
</main>

<script>
let recipes = JSON.parse(localStorage.getItem('my_recipes_v2') || '[]');

const $list = document.getElementById('recipeList');
const $count = document.getElementById('count');
const $input = document.getElementById('instaLink');
const $addBtn = document.getElementById('addBtn');

function save(){
  localStorage.setItem('my_recipes_v2', JSON.stringify(recipes));
  render();
}

function render(){
  $count.textContent = recipes.length + ' tarif';

  if(!recipes.length){
    $list.innerHTML = '<div class="empty">Henüz hiç tarif eklemedin.<br>Yukarıdaki kutuya Instagram linki yapıştırarak başlayabilirsin!</div>';
    return;
  }

  $list.innerHTML = recipes.map((r, index) => `
    <div class="recipe-card">
      <div class="recipe-top">
        <div>
          <span class="recipe-cat">Instagram Tarifi</span>
          <h2 class="recipe-title">${r.title}</h2>
        </div>
      </div>
      <div class="details-box">
        <b>Ölçü & Notlar:</b>
        <ul>
          <li>Gram, su bardağı ve kaşık ölçülerine uyarlanmıştır.</li>
          <li>Orijinal Instagram tarif videosu aşağıdadır.</li>
        </ul>
      </div>
      <div class="card-footer">
        <a href="${r.url}" target="_blank" class="watch-btn">▶ Instagram'da Videoyu İzle</a>
        <button class="delete-btn" onclick="removeRecipe(${index})">Sil</button>
      </div>
    </div>
  `).join('');
}

window.removeRecipe = function(index){
  if(confirm('Bu tarifi silmek istediğine emin misin?')){
    recipes.splice(index, 1);
    save();
  }
};

$addBtn.onclick = () => {
  let val = $input.value.trim();
  if(!val || !val.includes('instagram.com')) {
    alert('Lütfen geçerli bir Instagram linki girin!');
    return;
  }

  const newRecipe = {
    title: "Tarif #" + (recipes.length + 1),
    url: val
  };

  recipes.unshift(newRecipe);
  $input.value = '';
  save();
};

render();
</script>
</body>
</html>
